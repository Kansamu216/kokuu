modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuStudio/kokuu/issues"

[[mods]]
modId = "kokuu_core"
version = "${mod_version}"
displayName = "KokuuCore"
authors = "KokuuStudio"
description = '''
Core runtime for the Kokuu server suite.

Provides the plugin contract, service registry, data storage, text/colour
parsing and the placeholder system. It also ships the Kotlin runtime, so the
other kokuu-* plugins do not carry their own copy.

Installing this alone adds no gameplay content - it is the shared foundation
the other plugins require.

Server-side only. Clients do not need it.
'''

[[dependencies.kokuu_core]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.kokuu_core]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"
