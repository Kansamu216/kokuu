modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_core"
version = "${mod_version}"
displayName = "VoidkitCore"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Core runtime for the Voidkit server suite.

Provides the plugin contract, service registry, data storage, text/colour
parsing and the placeholder system. It also ships the Kotlin runtime, so the
other voidkit-* plugins do not carry their own copy.

Installing this alone adds no gameplay content - it is the shared foundation
the other plugins require.

Server-side only. Clients do not need it.
'''

[[dependencies.voidkit_core]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_core]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"
