// voidkit_core —— 内核。
//
// 开发运行（runServer）只在这里配置。要联调插件，把编译好的插件 jar
// 丢进 core/run/mods/ 即可 —— 这和整合包里的真实加载路径一致，比在
// Gradle 里拼 sourceSet 更能暴露问题。
//
// ── mc/1.21.1-forge 移植说明（2026-10-14）──────────────────────────
// ① 原来这里是 ModDevGradle 的 `neoForge { runs { server {...} } }`；
//    ForgeGradle 7 的 runs DSL 不同且与编译无关，故先注释，待接回：
//        minecraft { runs { server { ... } } }
//
// ② Kotlin 运行时打包：**FG7 把 Jar-in-Jar 拆成了独立插件**
//    （`net.minecraftforge.jarjar`，FG5/6 的 jarJar.enable() 已不存在 ——
//     实测 FG7.0.40 插件 jar 内连一个 JarJar 类都没有）。
//    依据官方示例 MDKExamples/jarjar-only/fg7-kotlin：
//      * jarJar.register() 创建 jarJar 任务（默认 classifier 为 all）
//      * 依赖写进名为 jarJar 的 configuration
//      * 版本语义：写精确版本 -> 打完包后约束为 [该版本,)，即只锁下界不写上界
//        （必须如此：整合包里的 KotlinForForge 可能声明更高的 stdlib）
//
// ⚠️ 产物形态：fat jar 由 **jarJar 任务**产出（不是 jar）。
//    本项目让 jarJar 直接用我们的规范名，普通 jar 退为 -slim，
//    bundleZip 对 core 取 jarJar 任务（见根 build.gradle）。
apply plugin: 'net.minecraftforge.jarjar'

jarJar.register()

dependencies {
    jarJar("org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}")
}

tasks.named('jarJar', Jar) {
    archiveFileName = "voidkit_core-${version}+mc${rootProject.ext.mcVersion}-${rootProject.ext.loader}.jar"
}
tasks.named('jar', Jar) {
    archiveFileName = "voidkit_core-${version}+mc${rootProject.ext.mcVersion}-${rootProject.ext.loader}-slim.jar"
}

