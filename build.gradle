plugins {
    // Fabric 线用 Loom 构建。版本卡在 1.10.5 —— Loom 1.11 要求 Gradle >= 8.14，
    // 而本仓库的 wrapper 是 8.12.1（Loom 1.10 要求 >= 8.12，正好合适）。
    id 'fabric-loom' version '1.10.5' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.0' apply false
}

// ==============================================================
// 全平台公共版本。改这里，五个子项目一起变。
// ==============================================================
ext {
    voidkitVersion = '0.1.0-beta.1'
    voidkitGroup = 'org.voidkit'
    voidkitAuthors = 'Kokuu Studio'
    voidkitLicense = 'MIT'

    // 加载器标识 —— 参与 jar 文件命名（voidkit_core-0.1.0-beta.1+mc1.21.1-fabric.jar）
    loader = 'fabric'

    // ------------------------------------------------------------
    // 目标版本线：-PmcVersion=xxx 切换（默认 1.21.1）
    //
    // 与 NeoForge 线不同，Fabric 的版本差异极小：Loom 负责映射与重混淆，
    // 版本线之间只差「Fabric API 版本 / Loader 版本 / Java 版本」。
    //
    // ⚠️ 但本分支（feat/fabric）实际只服务 **1.21.1**：
    //    按既定纪律「Fabric 也走分支」，1.20.1 的 Fabric 版将来是另一个分支。
    //    所以 fabric.mod.json 里的 minecraft 依赖范围是**写死**的（见各模块资源文件），
    //    这样就不必和 Loom 内置的占位符展开机制打架（Loom 只认 `${version}`）。
    // ------------------------------------------------------------
    mcVersion = (findProperty('mcVersion') ?: '1.21.1').toString()
    def lines = [
        '1.21.1': [fapi: '0.116.17+1.21.1', java: 21],
    ]
    def line = lines[mcVersion]
    if (line == null) throw new GradleException("未知版本线 mcVersion=${mcVersion}（本分支支持 ${lines.keySet()}）")

    fabricLoaderVersion = '0.19.5'
    fabricApiVersion = line.fapi
    javaToolchain = line.java as Integer

    kotlinVersion = '2.1.0'
}

// ==============================================================
// 子项目公共配置
// ==============================================================
subprojects { p ->
    // Loom 自带 java 插件（无需再 apply 'java'）
    apply plugin: 'fabric-loom'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    group = rootProject.ext.voidkitGroup
    version = rootProject.ext.voidkitVersion

    // 约定：目录名 essentials -> mod id / jar 名 voidkit_essentials
    // 加前缀是硬性要求 —— 整合包里有 165 个 mod，裸名 core/title/web 太容易撞。
    // 「一个 jar 一个 modId」：被合并模块（perm/economy 并入 essentials、title 并入 display）
    // 的源码在同一 sourceSet 里，但不再各自声明 @Mod（见 VoidkitEssentials / VoidkitDisplay）。
    def modId = "voidkit_${p.name}"
    ext.modId = modId

    base { archivesName = modId }

    // 编译器 toolchain 按版本线选（1.21.1 → JDK 21 / 1.20.4 → JDK 17），
    // 产物 target 与 toolchain 一致（各版本线的 MC 依赖 variant 锁死了对应 Java 版本，
    // 见 2026-10-13 实验：21.1.209 的依赖 variant 拒绝 Java 17 consumer）。
    java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaToolchain)

    repositories {
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
    }

    dependencies {
        // ---- Minecraft 与映射 ----
        minecraft "com.mojang:minecraft:${rootProject.ext.mcVersion}"
        // ★ 关键：官方 Mojang 映射。它给出的类名/方法名与 NeoForge / Forge 线**完全同名**，
        //    所以全仓 `net.minecraft.*` 一行都不用改（若换 Yarn 映射则要全仓改名）。
        mappings loom.officialMojangMappings()

        modImplementation "net.fabricmc:fabric-loader:${rootProject.ext.fabricLoaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.ext.fabricApiVersion}"

        implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
        // 单元测试：kotlin.test 映射到 JUnit 5（仅测不依赖 Minecraft 类的纯逻辑）
        testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${rootProject.ext.kotlinVersion}"

        // 只有内核内嵌 Kotlin 运行时（对称于 NeoForge 线的 jarJar）：四个插件都依赖 core，
        // 运行时从 core 拿；各塞一份 1.7MB 的 stdlib 是纯浪费。
        //
        // Fabric 这边反而比 NeoForge 简单：Loom 的 `include` 把 jar 放进产物内的
        // `META-INF/jars/`，由 Loader 自己解析 —— **不参与 FML 那套版本区间仲裁**，
        // 所以不存在 NeoForge 线「jarJar 区间不能写上界」的问题。
        //
        // 上面的 `implementation kotlin-stdlib` 仍然保留：开发运行时（runServer）
        // 从 classes 目录加载、不读嵌套 jar，靠它提供 classpath。
        if (p.name == 'core') {
            include "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(rootProject.ext.javaToolchain == 17
                ? org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                : org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
            freeCompilerArgs.add('-Xjvm-default=all')
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }

    // 🚨 `fabric.mod.json` 里的 `${version}` **必须自己展开** —— Loom 不会自动做。
    //    （fabric-example-mod 模板里那段 `filesMatching('fabric.mod.json') { expand ... }`
    //    是模板手写的，不是插件内置行为。）
    //    少了它，Loader 读到的 mod 版本就是字面量 `${version}`，会连带把依赖解析搞崩，
    //    报出来的却是「Minecraft 版本不对」这种**误导性错误** —— 实测踩过一次。
    //
    // MC 版本依赖范围是**写死**的（本分支只服务一条版本线），所以这里只有 version 一个变量。
    processResources {
        def props = [version: p.version.toString()]
        inputs.properties props
        filesMatching('fabric.mod.json') {
            expand props
        }
    }

    // 交付物命名：Loom 把 `jar` 当中间产物（产物名带 `-dev`），真正交付的是 `remapJar`。
    // 规格与 NeoForge / Forge 线保持一致：
    //     voidkit_core-0.1.0-beta.1+mc1.21.1-fabric.jar
    tasks.named('remapJar') {
        archiveFileName = "${modId}-${p.version}+mc${rootProject.ext.mcVersion}-${rootProject.ext.loader}.jar"
    }
}

// ==============================================================
// 整版打包：把当前版本线的全部 jar 打成一个 zip，作为 Release 附件。
//
// ⚠️ 必须取 `remapJar`（Loom 的**发布态**产物），不是 `jar`：
//    Loom 下 `jar` 是中间产物（intermediary 名、带 `-dev` 后缀），
//    只有 `remapJar` 才是能丢进正式服的那份。
//
//     build/dist/voidkit-0.1.0-beta.1+mc1.21.1-fabric.zip
//       ├── voidkit_core-0.1.0-beta.1+mc1.21.1-fabric.jar
//       └── …（共 5 个：core / essentials / display / utility / web）
//
// 用法：./build.sh bundleZip
// ==============================================================
tasks.register('bundleZip', Zip) {
    group = 'voidkit'
    description = '把当前版本线的全部 jar 打成一个 zip（Release 附件）'

    dependsOn subprojects.collect { it.tasks.named('remapJar') }

    archiveFileName = "voidkit-${voidkitVersion}+mc${mcVersion}-${loader}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    subprojects.each { p ->
        from(p.tasks.named('remapJar').flatMap { it.archiveFile })
    }
    // 摊平目录结构：zip 里只放 jar，不保留 build/libs 层级
    eachFile { it.path = it.name }
    includeEmptyDirs = false
}
