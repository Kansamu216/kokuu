plugins {
    id 'net.minecraftforge.gradle' version '[7.0.3,8)' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
}

// ==============================================================
// Voidkit · mc/1.21.1-forge 版本线
//
// 目标：Minecraft 1.21.1 + Forge 52.x（ForgeGradle 7）。
//
// 与主线 main（NeoForge 1.21.1）的关系：
//   * 业务代码（core.api + 全部插件）**一字未改** —— 只依赖 net.minecraft.*
//   * 加载器适配只换 `core/platform/forge/`（对应 neoforge/）
//   * 构建系统从 ModDevGradle 换成 ForgeGradle 7
//
// 关键事实（2026-10-14 实测核实）：
//   * Forge 1.21.1 运行时用**官方映射**（字节码里是 `ItemStack.isEmpty` 而非 `m_xxx_`）
//     → **不需要 reobf**，`build/libs` 的 jar 就是发布产物（与 1.20.1 线完全不同！）
//   * mods.toml（非 neoforge.mods.toml）、modLoader="javafml"、依赖 modId="forge"
//   * Forge 1.21.1 **没有 FakePlayer 类**（NeoForge 有）—— 见 ForgePlatform.kt
// ==============================================================
ext {
    voidkitVersion = '0.1.0-beta.1'
    voidkitGroup = 'org.voidkit'
    voidkitAuthors = 'Kokuu Studio'
    voidkitLicense = 'MIT'

    // 加载器标识 —— 参与 jar 文件命名（voidkit_core-0.1.0-beta.1+mc1.21.1-forge.jar）
    loader = 'forge'

    mcVersion = (findProperty('mcVersion') ?: '1.21.1').toString()
    def lines = [
        '1.21.1': [forge: '1.21.1-52.1.19', range: '[52,)', mcRange: '[1.21.1,1.22)', loaderRange: '[52,)', java: 21],
    ]
    def line = lines[mcVersion]
    if (line == null) throw new GradleException("未知版本线 mcVersion=${mcVersion}（支持 ${lines.keySet()}）")

    forgeVersion = line.forge
    // ⚠️ 变量名沿用 ${neo_range}（mods.toml 里的占位符），值为 Forge 的依赖区间。
    neoRange = line.range
    mcRange = line.mcRange
    loaderRange = line.loaderRange
    javaToolchain = line.java as Integer

    kotlinVersion = '2.4.21'
}

// ==============================================================
// 子项目公共配置
// ==============================================================
subprojects { p ->
    apply plugin: 'java'
    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.jetbrains.kotlin.jvm'

    group = rootProject.ext.voidkitGroup
    version = rootProject.ext.voidkitVersion

    def modId = "voidkit_${p.name}"
    ext.modId = modId

    base { archivesName = modId }

    java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaToolchain)

    repositories {
        // 🚨 ForgeGradle 的 mavenizer —— **必须调用**（官方 MDK 的原样写法）。
        //    它把 Forge maven 的元数据「maven 化」以供 minecraft.dependency(...) 解析。
        //    漏了会报：Could not isolate value ...MavenizerValueSource$Parameters
        //    （已实测：换 Gradle 版本无效，补上这三行才通过）
        minecraft.mavenizer(it)
        maven fg.forgeMaven
        maven fg.minecraftLibsMaven
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        mavenCentral()
    }

    // Forge 1.21.1：官方映射（不需要 reobf，也不存在 SRG）
    minecraft {
        mappings channel: 'official', version: rootProject.ext.mcVersion
    }

    dependencies {
        implementation minecraft.dependency("net.minecraftforge:forge:${rootProject.ext.forgeVersion}")
        implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.ext.kotlinVersion}"
        testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${rootProject.ext.kotlinVersion}"
        // TODO(移植)：Kotlin 运行时的 jarJar 打包（只有 core 需要），
        //   ForgeGradle 7 的 jarJar 语法与 MDG 不同，待首个编译里程碑通过后再接。
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(rootProject.ext.javaToolchain == 17
                ? org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                : org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
            freeCompilerArgs.add('-Xjvm-default=all')
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        testLogging {
            events 'failed', 'skipped'
            exceptionFormat 'full'
        }
    }

    // mods.toml 里的公共版本号占位符（Forge 用 mods.toml，不是 neoforge.mods.toml）
    processResources {
        def props = [
                mod_version : p.version,
                neo_range   : rootProject.ext.neoRange,
                mc_range    : rootProject.ext.mcRange,
                loader_range: rootProject.ext.loaderRange,
        ]
        inputs.properties props
        filesMatching(['META-INF/mods.toml']) {
            expand props
        }
    }

    jar {
        // 产物命名规格：模组名-模组版本+mc版本-加载器
        //   例：voidkit_core-0.1.0-beta.1+mc1.21.1-forge.jar
        archiveFileName = "${modId}-${p.version}+mc${rootProject.ext.mcVersion}-${rootProject.ext.loader}.jar"
        manifest {
            attributes([
                    'Specification-Title'   : modId,
                    'Specification-Vendor'  : rootProject.ext.voidkitAuthors,
                    'Specification-Version' : '1',
                    'Implementation-Title'  : p.name,
                    'Implementation-Version': p.version,
                    'Implementation-Vendor' : rootProject.ext.voidkitAuthors,
            ])
        }
    }
}

// ==============================================================
// 整版打包：build/dist/voidkit-<版本>+mc1.21.1-forge.zip
// 用法：./build.sh bundleZip
// ==============================================================
tasks.register('bundleZip', Zip) {
    group = 'voidkit'
    description = '把当前版本线的全部 jar 打成一个 zip（Release 附件）'

    dependsOn subprojects.collect { it.tasks.named('jar') }

    archiveFileName = "voidkit-${voidkitVersion}+mc${mcVersion}-${loader}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')

    subprojects.each { p ->
        from(p.tasks.named('jar').flatMap { it.archiveFile })
    }
    eachFile { it.path = it.name }
    includeEmptyDirs = false
}
