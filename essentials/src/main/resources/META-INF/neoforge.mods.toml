modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_essentials"
version = "${mod_version}"
displayName = "VoidkitEssentials"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Everything the average server needs in the way of commands.

Homes, warps, spawn, back, TPA (with clickable accept/deny buttons), admin
tools (fly / god / heal / feed / speed / vanish / hat / enderchest / invsee)
and player/server info lookup.

It also takes over the vanilla commands players type most often and gives them
short aliases:

  /day /night /noon /midnight /dawn /dusk   ->  /time set ...
  /freeze /unfreeze                         ->  toggle doDaylightCycle
  /sun /rain /thunder                       ->  /weather ...
  /gr <rule> [value]                         ->  /gamerule ...  (no value = query)
  /diff <0-3|name>                           ->  /difficulty ...
  /gm  <0-3|s|c|a|sp>                        ->  /gamemode ...

Those are forwarded to vanilla rather than reimplemented, so behaviour, messages
and edge cases stay exactly as Mojang wrote them. Each alias is registered
independently, so a name clash with another mod only skips that one alias
instead of breaking command registration entirely.

Every module here can be toggled individually via the `features` config.
Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_essentials]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_essentials]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_essentials]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"

# ---------------------------------------------------------------------------
# 以下两个 mod 与 voidkit_essentials 打包进同一个 jar（8 jar -> 5 jar 合并）。
# modId 原样保留，Mod List 里仍能看到 voidkit_perm / voidkit_economy；
# 各组内模块只依赖 voidkit_core，彼此之间不再互相依赖。
# 配置/数据路径（voidkit/perm/、voidkit/economy/）与 feature id 均未改变，
# 现有服务器升级后配置不会丢失。
# ---------------------------------------------------------------------------

[[mods]]
modId = "voidkit_perm"
version = "${mod_version}"
displayName = "VoidkitPerm"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Permission management for the Voidkit suite: inheritance group tree, weighted
priorities, wildcard and negated nodes, per-player overrides and temporary
permissions. Editable in-game via /perm and over the management API.

This plugin is optional. Without it voidkit_core falls back to vanilla OP checks.

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_perm]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_perm]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_perm]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"

[[mods]]
modId = "voidkit_economy"
version = "${mod_version}"
displayName = "VoidkitEconomy"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
A minimal, provider-style economy for the Voidkit suite.

It exists so that other plugins (shops, titles, quests) can move money around
without caring who implements it. The interface lives in voidkit_core
(EconomyProvider), this plugin is just the default implementation.

Ships /balance, /pay and an admin /eco command, plus the %balance% placeholder.
Install it only if you actually want an economy - without it, every other
plugin still works and economy calls degrade to "unavailable".

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_economy]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_economy]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_economy]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
