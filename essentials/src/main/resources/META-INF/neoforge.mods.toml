modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_essentials"
version = "${mod_version}"
displayName = "VoidkitEssentials"
authors = "Kokuu Studio"
description = '''
Everything the average server needs in the way of commands.

Homes, warps, spawn, back, TPA (with clickable accept/deny buttons), admin
tools (fly / god / heal / feed / speed / vanish / hat / enderchest / invsee)
and player/server info lookup.

It also takes over the vanilla commands players type most often and gives them
short aliases:

  /day /night /noon /midnight /dawn /dusk   ->  /time set ...
  /freeze /unfreeze                         ->  toggle doDaylightCycle
  /sun /rain /thunder                       ->  /weather ...
  /gr <rule> [value]                         ->  /gamerule ...  (no value = query)
  /diff <0-3|name>                           ->  /difficulty ...
  /gm  <0-3|s|c|a|sp>                        ->  /gamemode ...

Those are forwarded to vanilla rather than reimplemented, so behaviour, messages
and edge cases stay exactly as Mojang wrote them. Each alias is registered
independently, so a name clash with another mod only skips that one alias
instead of breaking command registration entirely.

Every module here can be toggled individually via the `features` config.
Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_essentials]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_essentials]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_essentials]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
