modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_utility"
version = "${mod_version}"
displayName = "VoidkitUtility"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Server upkeep tools for the Voidkit suite: a scheduled entity sweep (item and XP
orb cleanup with countdown warnings) and short aliases for the vanilla world
commands (/day, /night, /sun, /rain, /gr, /diff ...).

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_utility]]
modId = "forge"
mandatory = true
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_utility]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_utility]]
modId = "voidkit_core"
mandatory = true
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
