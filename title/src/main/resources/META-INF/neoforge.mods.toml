modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_title"
version = "${mod_version}"
displayName = "VoidkitTitle"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Player titles for the Voidkit suite, with an in-game chest GUI to pick one.
Titles are gated by permission nodes rather than a separate ownership list, so
granting and revoking stays in one place.

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_title]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_title]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_title]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
