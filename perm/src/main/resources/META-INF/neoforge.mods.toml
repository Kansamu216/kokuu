modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_perm"
version = "${mod_version}"
displayName = "VoidkitPerm"
authors = "Kokuu Studio"
description = '''
Permission management for the Voidkit suite: inheritance group tree, weighted
priorities, wildcard and negated nodes, per-player overrides and temporary
permissions. Editable in-game via /perm and over the management API.

This plugin is optional. Without it voidkit_core falls back to vanilla OP checks.

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_perm]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_perm]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_perm]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
