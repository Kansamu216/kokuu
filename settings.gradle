pluginManagement {
    repositories {
        // Loom 插件来自 Fabric 官方 maven（国内直连可用，实测 200）
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'voidkit'

// ---------------------------------------------------------------
// 内核 + 四个插件，合并后共 **5 个 jar**。每个子项目产出一个独立 jar。
//
//   voidkit_core        内核：插件契约、服务注册表、数据存储、文本层、变量、多语言
//                       （不含任何 HTTP、不含权限实现、不含经济实现）
//   voidkit_essentials  传送 / 家 / 传送点 / 管理工具 + 权限 + 经济（吸收 perm、economy 的源码）
//   voidkit_display     MOTD / TAB / 记分牌 / 聊天栏 + 称号（吸收 title 的源码）
//   voidkit_utility     服务器维护：清扫 + 性能监测
//   voidkit_web         管理 API 桥（配合 hub/ panel/ 两个 Go 程序）
//
// ⚠️ 合并是**真源码合并**：一个 jar 只声明一个 mod id（Fabric 线的 fabric.mod.json
//    同样一个 jar 只能有一个 mod id，两条加载器因此能复用同一套分组）。
//    perm / economy / title 的类被编进幸存 jar，但不再各自作为独立 mod 被 FML 加载。
//
// ⚠️ 合并不改变这些：每个 feature 仍可单独开关（共 23 个）；每个模块的数据目录
//    （voidkit/perm/、voidkit/title/、voidkit/economy/ …）也没变 —— 路径是代码里的
//    字面量常量，与 modId 无关。所以现有服务器升级后配置与数据不会丢失。详见 MIGRATION.md。
//
// 操作审计（voidkit_inspector）已独立成仓：github.com/KokuuWork/voidkit-inspector
//
// 依赖方向：所有插件 -> core。插件之间**只通过 core 的 api 包**通信，
// 不允许直接依赖彼此（core 里定义了 PermissionProvider / EconomyProvider 等接口）。
// ---------------------------------------------------------------
include 'core'
include 'essentials'
include 'display'
include 'utility'
include 'web'
