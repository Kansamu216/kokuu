pluginManagement {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'voidkit'

// ---------------------------------------------------------------
// 内核 + 七个插件。每个子项目产出独立 jar，可单独安装、单独发布。
//
//   voidkit_core        内核：插件契约、服务注册表、数据存储、文本层、变量、多语言
//                       （不含任何 HTTP、不含权限实现、不含经济实现）
//   voidkit_essentials  传送 / 家 / 传送点 / 管理工具
//   voidkit_display     MOTD / TAB / 记分牌 / 聊天栏
//   voidkit_perm        LuckPerms 风格的权限组与节点
//   voidkit_title       称号（含游戏内 GUI）
//   voidkit_commands    原版命令接管：时间 / 天气 / 游戏规则 / 难度 / 游戏模式
//   voidkit_interact    公告与菜单（钟表菜单）
//   voidkit_economy     经济 API（为商店 / 称号扩展预留）
//   voidkit_utility     服务器维护：清扫 + 性能监测
//   voidkit_web         管理 API 桥（配合 hub/ panel/ 两个 Go 程序）
//   voidkit_inspector   反熊孩子查询（COI）：方块 / 容器 / 实体操作审计，SQLite 存储
//
// 依赖方向：所有插件 -> core。插件之间**只通过 core 的 api 包**通信，
// 不允许直接依赖彼此（core 里定义了 PermissionProvider / EconomyProvider 等接口）。
// ---------------------------------------------------------------
include 'core'
include 'essentials'
include 'display'
include 'perm'
include 'title'
include 'economy'
include 'utility'
include 'web'
include 'inspector'
