name: docs

# 构建 VuePress 文档站并部署到 GitHub Pages（https://kokuuwork.github.io/voidkit/）
#
# 触发：main 分支上 docs / package 相关文件有改动时；也可手动触发。
# 说明：仓库 Settings → Pages 的 Source 需设为 "GitHub Actions"。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# 只允许一个并发的 Pages 部署；不打断进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # lastUpdated 需要完整 git 历史来取每页的最后提交时间
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 ci：严格按 package-lock.json 安装，保证构建可复现
      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
