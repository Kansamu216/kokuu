modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_display"
version = "${mod_version}"
displayName = "VoidkitDisplay"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Everything that faces the player: presentation and interaction.

  motd         server list MOTD, with rotation across multiple variants
  tab          tab list header and footer
  scoreboard   per-player sidebar, switchable by permission group
  chat-format  chat layout, player-name hover card, click actions
  announce     manual broadcasts plus a rotating auto-broadcast
  menu         JSON-driven chest menus, bindable to an item (the classic
               "clock menu": hold a clock, right-click, get a menu)

All of them share one small inline markup DSL for colour codes, placeholders and
clickable actions.

Note that the vanilla protocol limits what is possible: scoreboard lines are
plain strings and the server list entry does not accept click events, so those
two cannot have clickable or hovering text. Chat, the tab header/footer and
menus can.

Every module here can be toggled individually via the `features` config.

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_display]]
modId = "forge"
mandatory = true
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_display]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_display]]
modId = "voidkit_core"
mandatory = true
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
