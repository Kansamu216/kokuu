modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuStudio/kokuu/issues"

[[mods]]
modId = "kokuu_display"
version = "${mod_version}"
displayName = "KokuuDisplay"
authors = "KokuuStudio"
description = '''
Presentation layer for the Kokuu suite: server list MOTD, tab list header and
footer, per-player sidebar scoreboard, and chat formatting. All of them support
legacy colour codes, placeholders, click actions and hover tooltips via a small
inline markup DSL.

Requires kokuu_core. Server-side only.
'''

[[dependencies.kokuu_display]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.kokuu_display]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.kokuu_display]]
modId = "kokuu_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
