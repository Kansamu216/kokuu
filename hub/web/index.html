<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoidkitHub 管理平台</title>
  <!-- 品牌视觉包提供的图标（icons/icon.png）。整个 web/ 目录由 go:embed 打进二进制 -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#4f46e5">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 登录 -->
  <div id="login" class="login">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1><img class="brand-mark" src="icon-128.png" alt="" width="22" height="22">VoidkitHub</h1>
      <p class="sub">MULTI-SERVER CONTROL</p>

      <label class="field">
        <span>Hub 地址</span>
        <input id="login-base" type="text" placeholder="http://127.0.0.1:9000">
      </label>
      <label class="field">
        <span>用户名</span>
        <input id="login-user" type="text" value="admin" autocomplete="username">
      </label>
      <label class="field">
        <span>密码</span>
        <input id="login-pass" type="password" placeholder="启动 Hub 时日志里打印的密码" autocomplete="current-password">
      </label>

      <button class="btn primary block" type="submit">进入平台</button>
      <p id="login-error" class="error"></p>
      <p class="hint">
        账号密码在 Hub 启动日志里（存在 <code>hubdata/config.json</code>，可改）。<br>
        各台游戏服的 apiToken 存在 Hub 上，不会下发到浏览器。
      </p>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <aside class="side">
      <div class="brand"><img class="brand-mark" src="icon-128.png" alt="" width="22" height="22"><strong>Voidkit</strong></div>
      <nav id="nav">
        <span class="nav-group">监控</span>
        <button data-view="fleet" class="on">总览</button>
        <button data-view="servers">服务器</button>
        <span class="nav-group">数据</span>
        <button data-view="players">玩家</button>
        <button data-view="logs">日志</button>
        <span class="nav-group">智能</span>
        <button data-view="inspect">智能审计</button>
        <span class="nav-group">反作弊</span>
        <button data-view="guard-console">会话控制台</button>
        <button data-view="guard-bans">封禁管理</button>
        <button data-view="guard-whitelist">白名单</button>
        <button data-view="guard-report">玩家报告</button>
        <button data-view="guard-audit">审计日志</button>
        <span class="nav-group">系统</span>
        <button data-view="modules">模块</button>
      </nav>
      <div class="foot">
        <span id="foot-fleet">— 台服务器</span>
        <span id="foot-players">在线 —</span>
        <button class="btn block" id="logout">退出</button>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h2 id="title">总览</h2>
          <p id="subtitle" class="sub"></p>
        </div>
        <div class="head-actions">
          <label id="selector-wrap" class="selector hidden">
            <span>当前服务器</span>
            <select id="selector"></select>
          </label>
          <span id="refreshed" class="tiny"></span>
          <button class="btn" id="refresh">刷新</button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="drawer" class="drawer"><div class="drawer-panel" id="drawer-panel"></div></div>
  <div id="modal" class="modal"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>

</html>
