<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KokuuCore 管理台</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 登录 / 连接 -->
  <div id="login" class="login">
    <form class="login-card" id="login-form" autocomplete="off">
      <h1><span class="dot"></span>KokuuCore</h1>
      <p class="sub">服务器管理台</p>

      <label class="field">
        <span>接口地址</span>
        <input id="login-base" type="text" placeholder="http://127.0.0.1:8765">
      </label>
      <label class="field">
        <span>访问令牌</span>
        <input id="login-token" type="password" placeholder="游戏内 /kcore token 获取">
      </label>

      <button class="btn primary block" type="submit">连接服务器</button>
      <p id="login-error" class="error"></p>
      <p class="hint">令牌只存在本机浏览器里，不会上传到任何第三方。</p>
    </form>
  </div>

  <!-- 主界面 -->
  <div id="app" class="hidden">
    <aside class="side">
      <div class="brand"><span class="dot"></span><strong>KokuuCore</strong></div>
      <nav id="nav">
        <button data-view="overview" class="on">概览</button>
        <button data-view="players">玩家</button>
        <button data-view="logs">日志</button>
        <button data-view="modules">模块</button>
      </nav>
      <div class="foot">
        <span id="foot-online">在线 —</span>
        <span id="foot-tps">TPS —</span>
        <button class="btn block" id="logout">断开</button>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <div>
          <h2 id="title">概览</h2>
          <p id="subtitle" class="sub"></p>
        </div>
        <div class="head-actions">
          <span id="refreshed" class="tiny"></span>
          <button class="btn" id="refresh">刷新</button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <!-- 玩家详情 -->
  <div id="drawer" class="drawer"><div class="drawer-panel" id="drawer-panel"></div></div>
  <!-- 弹窗 / 提示 -->
  <div id="modal" class="modal"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>

</html>
