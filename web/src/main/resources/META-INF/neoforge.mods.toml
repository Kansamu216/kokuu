modLoader = "javafml"
loaderVersion = "${loader_range}"
license = "MIT"
issueTrackerURL = "https://github.com/KokuuWork/voidkit/issues"

[[mods]]
modId = "voidkit_web"
version = "${mod_version}"
displayName = "VoidkitWeb"
authors = "Kokuu Studio"
logoFile = "icon.png"
description = '''
Management API bridge for the Voidkit suite. It runs a small HTTP+JSON server
(JDK built-in, no extra dependencies) that exposes the routes registered by
voidkit_core and the other plugins, and serves the VoidkitHub / panel front-ends.

voidkit_core itself contains no HTTP code at all - without this plugin nothing
ever listens on a port.

Requires voidkit_core. Server-side only.
'''

[[dependencies.voidkit_web]]
modId = "neoforge"
type = "required"
versionRange = "${neo_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_web]]
modId = "minecraft"
type = "required"
versionRange = "${mc_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.voidkit_web]]
modId = "voidkit_core"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "SERVER"
